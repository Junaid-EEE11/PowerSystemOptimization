project:
  seed: 20260902
  mode: quick
  output_root: results
data:
  source: synthetic
  periods: 4800
  frequency_minutes: 15
  synthetic_watermark: "SYNTHETIC DEVELOPMENT DATA - NOT FOR SCIENTIFIC CLAIMS"
split:
  forecast_train: 0.60
  residual_calibration: 0.15
  decision_calibration: 0.10
  test: 0.15
forecast:
  lags: [1, 4, 96, 672]
  rolling_windows: [4, 96]
  quantiles: [0.05, 0.50, 0.95]
  scale_floor: 0.01
  linear_model:
    alpha: 1.0
  point_model:
    max_iter: 150
    max_leaf_nodes: 15
    l2_regularization: 0.1
  quantile_model:
    n_estimators: 120
    max_depth: 3
    learning_rate: 0.05
network:
  name: ieee33
  base_mva: 10.0
  base_kv: 12.66
  v_min: 0.95
  v_max: 1.05
  pv_buses: [6, 13, 18, 25, 30]
  pv_penetration: 0.40
  inverter_oversize: 1.10
optimization:
  methods: [m0, m1, m2, m3, m4, m5]
  solver: CLARABEL
  allow_curtailment: false
  cvar_alpha: 0.95
  epsilon_grid: [0.0, 0.025, 0.05, 0.10, 0.20]
  reliability_target: 0.05
  scenario_count: 25
  weights:
    loss: 1.0
    voltage: 20.0
    curtailment: 100.0
    reactive: 0.1
experiment:
  max_decision_calibration_points: 12
  max_test_points: 24
  pv_penetrations: [0.20, 0.40, 0.60, 0.80]
  stress_error_scales: [1.0, 1.5, 2.0]
  load_biases: [0.0, 0.05, 0.10]
  bootstrap_replicates: 500
  bootstrap_block_length: 4
