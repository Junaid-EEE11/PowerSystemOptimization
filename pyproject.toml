[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-wdro-grid"
version = "0.1.0"
description = "Conformal-scaled Wasserstein distributionally robust Volt/VAR research software"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "CS-WDRO contributors"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "cvxpy>=1.6,<2",
  "clarabel>=0.9,<1",
  "matplotlib>=3.9,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
ac = ["pandapower>=3.0,<4", "opendssdirect.py>=0.9,<1"]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[project.scripts]
cs-wdro-grid = "cs_wdro_grid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".python", ".venv", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
